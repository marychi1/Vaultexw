services:
  frontend:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./frontend-next:/app/frontend-next
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm --workspace=frontend-next run dev

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
