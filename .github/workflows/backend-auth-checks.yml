name: Backend authentication checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-auth-checks.yml'
  push:
    branches:
      - main
      - 'security/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-auth-checks.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Run tests
        run: npm test -- --passWithNoTests
